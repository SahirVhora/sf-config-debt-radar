[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sf-config-debt-radar"
version = "1.0.0"
description = "SAP SuccessFactors EC Configuration Debt Scanner — CLI, browser dashboard, and MCP server"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Sahir Vhora" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0.0",
  "requests>=2.28.0",
  "urllib3>=1.26.0",
  "pyyaml>=6.0",
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/SahirVhora/sf-config-debt-radar"
Repository = "https://github.com/SahirVhora/sf-config-debt-radar"

[project.scripts]
sf-config-debt-radar = "sf_config_debt_radar.cli:main"
sf-config-debt-scanner-mcp = "mcp_server:main"

[tool.setuptools.packages.find]
include = ["sf_config_debt_radar*"]
