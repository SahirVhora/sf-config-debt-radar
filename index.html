<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090a">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="mask-icon" href="favicon.svg" color="#c8a84e">
<title>SF Config Debt Radar</title>
<style>
:root{--bg:#08090a;--panel:#111317;--panel2:#171a20;--line:#2a2f38;--text:#f6f3ea;--muted:#9ca3af;--gold:#c8a84e;--red:#ef4444;--amber:#f59e0b;--green:#22c55e;--blue:#38bdf8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#202319,#08090a 35%,#050506);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:rgba(8,9,10,.86);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.wrap{max-width:1240px;margin:auto;padding:22px}h1{font-size:34px;margin:0}.sub{color:var(--muted);margin:8px 0 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.tab{border:1px solid var(--line);background:#0d0f12;color:var(--text);border-radius:999px;padding:9px 14px;cursor:pointer}.tab.active{background:#2a220f;border-color:#6c5516;color:#f5d66f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:linear-gradient(180deg,var(--panel),#0c0e11);border:1px solid var(--line);border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 20px 60px rgba(0,0,0,.24)}.metric{font-size:42px;font-weight:850;color:var(--gold)}.muted{color:var(--muted)}button,.btn{background:#211a0c;color:#f6d979;border:1px solid #6c5516;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700}button.secondary{background:#151820;color:#d5dae5;border-color:var(--line)}button.danger{background:#2a1010;color:#ffb4b4;border-color:#743030}input,select,textarea{width:100%;background:#090b0e;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:6px}textarea{min-height:110px}label{display:block;margin:12px 0;color:#d8dde8}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hidden{display:none}.view{display:none}.view.active{display:block}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:#d5dae5;background:#12151a}.sev-CRITICAL{color:#fecaca}.sev-HIGH{color:#fed7aa}.sev-MEDIUM{color:#fde68a}.sev-LOW{color:#d1d5db}.mono{font-family:monospace;white-space:pre-wrap;background:#0a0c10;padding:12px;border-radius:12px;overflow-x:auto}.notice{padding:14px;border-radius:12px;margin:12px 0}.warn{background:#2a1f0a;border:1px solid #6c5516}.phase{border-left:3px solid var(--gold);padding:12px 18px;margin:14px 0}.heat{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.fill{height:100%;background:var(--gold);border-radius:4px}.q{padding:14px 0;border-bottom:1px solid var(--line)}.q-title{font-weight:700;margin-bottom:8px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:700}
.group-card{border:1px solid var(--line);border-radius:14px;margin:12px 0;background:#0c0e11;overflow:hidden}.group-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;cursor:pointer}.group-body{display:none;padding:0 15px 15px}.group-card.open .group-body{display:block}.mini{font-size:12px}.status-select{min-width:150px;width:auto;padding:7px;margin:0}.compare-up{color:#fecaca}.compare-down{color:#bbf7d0}.compare-flat{color:var(--muted)}</style>
</head>
<body>
<header><div class="wrap"><h1>SF Config Debt Radar</h1><p class="sub">EC-only configuration debt scanner and client-facing assessment. Metadata, counts, and findings only.</p><div class="tabs" id="tabs"></div></div></header>
<main class="wrap">
<section id="overview" class="view active"></section>
<section id="assessment" class="view"></section>
<section id="metadata" class="view"></section>
<section id="connect" class="view"></section>
<section id="findings" class="view"></section>
<section id="roadmap" class="view"></section>
<section id="export" class="view"></section>
</main>
<script>
const AREAS=['Business Rules','RBP','Workflows','Event Reasons','Foundation Objects','Custom Fields','Picklists','MDF Objects','Integrations','Reports','Metadata'];
const WEIGHTS={'Business Rules':18,RBP:15,Workflows:12,'Event Reasons':10,'Foundation Objects':10,'Custom Fields':10,Picklists:8,'MDF Objects':8,Integrations:6,Reports:3,Metadata:8};
const POINTS={CRITICAL:10,HIGH:6,MEDIUM:3,LOW:1};
const AREA_EVIDENCE={
'Business Rules':{metadata:['Rule','BusinessRule','RuleAssignment','RuleTrace'],odata:'Business rule OData entities if enabled, usually searched by names containing Rule or BusinessRule.',extract:'Admin Center > Configure Business Rules export, or Integration Center/API extract for rule definitions and assignments. Add rule count, trigger object, target field, last modified, owner, and active status to repo data/business-rules.csv.'},
RBP:{metadata:['PermissionRole','PermissionGroup','PermissionUserRoleAssignment','RoleBasedPermission'],odata:'RBP OData entities when exposed, usually PermissionRole, PermissionGroup, and role assignment objects.',extract:'Admin Center > Manage Permission Roles and Manage Permission Groups export, or use the dedicated RBP API/Integration Center where enabled. Add role, permission block, target population, group, user count, and last reviewed date to repo data/rbp-matrix.csv.'},
Workflows:{metadata:['WfRequest','Workflow','WorkflowStep','WfConfig','WfStepApprover'],odata:'Workflow request/config entities where enabled, usually WfRequest or Workflow* objects.',extract:'Admin Center > Manage Organization, Pay and Job Structures workflow config, plus workflow request exports for volume/aging. Add config, approver path, escalation, fallback, pending count, and age to repo data/workflows.csv.'},
'Event Reasons':{metadata:['FOEventReason','EventReason','EmpEmploymentTermination'],odata:'Event reason foundation object metadata and EmpJob.eventReason field exposure.',extract:'Admin Center > Manage Organization, Pay and Job Structures > Event Reason export, plus EmpJob counts by eventReason. Add event reason, status, employee-status mapping, usage count, and last used date to repo data/event-reasons.csv.'},
'Foundation Objects':{metadata:['FO','FODepartment','FOCompany','FODivision','FOLocation','FOCostCenter'],odata:'Foundation object entities, commonly FO* plus effective status and dating fields.',extract:'Export Foundation Objects from Admin Center or OData counts by object/status. Add code, object type, active flag, parent, incumbent count, and last modified date to repo data/foundation-objects.csv.'},
'Custom Fields':{metadata:['custom','cust_'],odata:'Directly detectable from $metadata field names and labels. No record values are read.',extract:'Already covered by $metadata for schema debt. For usage, add field, object, label, visibility, populated count, report usage, and integration dependency to repo data/custom-fields.csv.'},
Picklists:{metadata:['Picklist','PicklistOption','PicklistLabel'],odata:'Picklist and PicklistOption entities where exposed.',extract:'Admin Center > Picklist Center export, or OData Picklist/PicklistOption counts. Add picklist, option, status, parent, translation coverage, and usage count to repo data/picklists.csv.'},
'MDF Objects':{metadata:['cust_','MDF','GenericObject'],odata:'Custom MDF objects are directly detectable when entity names start cust_ or generic object metadata is exposed.',extract:'Admin Center > Configure Object Definitions export. Add object, effective dating, API visibility, secured flag, owner, and record count to repo data/mdf-objects.csv.'},
Integrations:{metadata:['Integration','IntegrationCenter','CompoundEmployee','Upsert','ODataAPIAuditLog'],odata:'Only limited integration metadata is visible in $metadata. Runtime jobs and consumers usually need admin exports.',extract:'Integration Center export, Scheduled Job Manager, API audit logs, and middleware catalogue. Add interface, object, fields, direction, consumer, schedule, last run, and owner to repo data/integrations.csv.'},
Reports:{metadata:['Report','AdHocReport','CanvasReport','TableReport'],odata:'Report catalogue is rarely complete in OData metadata.',extract:'Report Center export or Story/Canvas/Table report inventory. Add report name, type, owner, last run, field list, and audience to repo data/reports.csv.'},
Metadata:{metadata:['EntityType'],odata:'Fully covered by OData $metadata for entity, field, navigation, and annotation-level schema signals.',extract:'Use this app or save raw $metadata to repo data/metadata.xml for repeatable evidence and version comparison.'}
};
const QUESTIONS=[
{area:'Business Rules',q:'Do multiple EC business rules update the same Job Info or Compensation fields?',opts:['No','Not sure','Yes, 2-3 rules','Yes, 4+ rules'],sev:['LOW','MEDIUM','HIGH','CRITICAL']},
{area:'Business Rules',q:'Are critical business rules documented with owner, purpose, trigger, and test case?',opts:['Yes','Partly','No','Not sure'],sev:['LOW','MEDIUM','HIGH','MEDIUM']},
{area:'RBP',q:'Are EC admin roles reviewed for overlap and toxic combinations?',opts:['Quarterly','Annually','Rarely','Never'],sev:['LOW','MEDIUM','HIGH','CRITICAL']},
{area:'Workflows',q:'Do EC workflows have escalation or fallback approvers?',opts:['All','Most','Some','None'],sev:['LOW','MEDIUM','HIGH','CRITICAL']},
{area:'Event Reasons',q:'Are unused event reasons reviewed and retired regularly?',opts:['Quarterly','Annually','Rarely','Never'],sev:['LOW','MEDIUM','HIGH','CRITICAL']},
{area:'Picklists',q:'Are critical EC picklists checked for duplicate labels, inactive-used values, and translations?',opts:['Yes','Partly','Rarely','Never'],sev:['LOW','MEDIUM','HIGH','CRITICAL']},
{area:'Foundation Objects',q:'Are active but unused departments, divisions, locations, and cost centers reviewed?',opts:['Yes','Partly','Rarely','Never'],sev:['LOW','MEDIUM','HIGH','CRITICAL']},
{area:'Custom Fields',q:'Are hidden or mostly blank EC custom fields reviewed before new design work?',opts:['Always','Sometimes','Rarely','Never'],sev:['LOW','MEDIUM','HIGH','CRITICAL']},
{area:'MDF Objects',q:'Do custom MDF objects have owner, purpose, naming standard, and review date?',opts:['All','Most','Some','None'],sev:['LOW','MEDIUM','HIGH','CRITICAL']},
{area:'Integrations',q:'Is there a field dependency register for EC integrations?',opts:['Yes','Partly','No','Not sure'],sev:['LOW','MEDIUM','HIGH','MEDIUM']},
{area:'Reports',q:'Are EC reports reviewed for obsolete fields, event reasons, and FO values?',opts:['Quarterly','Annually','Rarely','Never'],sev:['LOW','MEDIUM','HIGH','CRITICAL']},
{area:'Metadata',q:'Do admins have a current EC configuration inventory?',opts:['Yes','Partly','No','Not sure'],sev:['LOW','MEDIUM','HIGH','MEDIUM']}
];
let state=JSON.parse(localStorage.getItem('sfDebtRadar')||'{}');
state.answers=state.answers||{};state.findings=state.findings||demoFindings();state.summary=state.summary||{entity_count:0,ec_entity_count:0,custom_mdf_count:0,custom_field_count:0};state.entityNames=state.entityNames||[];state.findingStatus=state.findingStatus||{};state.previousReport=state.previousReport||null;
// Password is kept in sessionStorage only (wiped on tab close) — never persisted to localStorage
if(state.password){sessionStorage.setItem('sfDebtRadarPwd',state.password);delete state.password;}
const VIEWS=['overview','assessment','metadata','connect','findings','roadmap','export'];
function save(){let {password:_pw,...rest}=state;localStorage.setItem('sfDebtRadar',JSON.stringify(rest));if(state.password!==undefined)sessionStorage.setItem('sfDebtRadarPwd',state.password);}
// Accessor helpers so all code can use state.password transparently via sessionStorage
Object.defineProperty(state,'password',{get(){return sessionStorage.getItem('sfDebtRadarPwd')||undefined;},set(v){if(v===undefined||v===null){sessionStorage.removeItem('sfDebtRadarPwd');}else{sessionStorage.setItem('sfDebtRadarPwd',v);}},enumerable:true,configurable:true});
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function switchView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===id));render();}
function initTabs(){document.getElementById('tabs').innerHTML=VIEWS.map(v=>`<button class="tab ${v==='overview'?'active':''}" data-view="${v}" onclick="switchView('${v}')">${title(v)}</button>`).join('');}
function title(v){return v.split('-').map(x=>x[0].toUpperCase()+x.slice(1)).join(' ');}
function findingPoints(f){return (POINTS[f.severity]||1)*(WEIGHTS[f.area]||5);}

function metadataEntityHits(area){let cfg=AREA_EVIDENCE[area]||{};let names=state.entityNames||[];if(!names.length)return[];if(area==='Metadata')return names.length?['EntityType'] : [];return names.filter(n=>(cfg.metadata||[]).some(p=>p==='custom'?n.toLowerCase().includes('custom'):p==='cust_'?n.startsWith('cust_'):n.toLowerCase().includes(String(p).toLowerCase()))).slice(0,12);}
function areaCoverageRows(){return AREAS.map(area=>{let cfg=AREA_EVIDENCE[area]||{};let hits=metadataEntityHits(area);let metadataStatus=!state.entityNames?.length?'Not scanned':(hits.length?'Detected in metadata':'Needs separate extract');let basis=hits.length?hits.join(', '):(cfg.odata||'Not normally visible from $metadata alone.');return{area,metadataStatus,basis,extract:cfg.extract||'Add a CSV extract to repo data/ for this area.'};});}
function coverageClass(status){return status==='Detected in metadata'?'compare-down':status==='Needs separate extract'?'compare-up':'compare-flat';}
function coverageTable(){let rows=areaCoverageRows();return `<table><thead><tr><th>Area</th><th>$metadata coverage</th><th>Evidence basis</th><th>If not visible, extract from</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.area)}</td><td class="${coverageClass(r.metadataStatus)}">${esc(r.metadataStatus)}</td><td>${esc(briefText(r.basis,120))}</td><td>${esc(briefText(r.extract,190))}</td></tr>`).join('')}</tbody></table>`;}
function evidenceGapFindings(names){if(!names.length)return demoFindings();return areaCoverageRows().filter(r=>r.metadataStatus==='Needs separate extract').map(r=>({source:'evidence-gap',severity:'LOW',area:r.area,title:'Evidence source not available in $metadata',detail:`${r.area} could not be assessed from OData $metadata. ${r.extract}`,recommendation:'Add the named extract to the repository data folder, then include it in the next assessment run.'}));}
function score(){let byArea={};let sev={};for(const f of activeFindings()){byArea[f.area]=(byArea[f.area]||0)+findingPoints(f);sev[f.severity]=(sev[f.severity]||0)+1;}let areaScores={};for(const a of AREAS){areaScores[a]=Math.max(0,Math.min(100,100-Math.round(((byArea[a]||0)/(WEIGHTS[a]||5))*8)));}let total=AREAS.reduce((s,a)=>s+areaScores[a]*(WEIGHTS[a]||5),0);let w=AREAS.reduce((s,a)=>s+(WEIGHTS[a]||5),0);let overall=Math.round(total/w);let risk=overall>=85?'Low':overall>=70?'Medium':overall>=50?'High':'Critical';return{overall,risk,areaScores,sev};}
const SEVERITY_ORDER={CRITICAL:0,HIGH:1,MEDIUM:2,LOW:3};
function sortFindings(list){return [...list].sort((a,b)=>(SEVERITY_ORDER[a.severity]??9)-(SEVERITY_ORDER[b.severity]??9)||String(a.area).localeCompare(String(b.area))||String(a.title).localeCompare(String(b.title)));}
function enrichRecommendation(f){let base=f.recommendation||'Review and add owner.';let next={CRITICAL:'Immediate action: assign an owner this week, confirm business impact, and pause dependent changes until understood.',HIGH:'Next step: validate usage, owner, and integration/report dependency, then decide keep, merge, retire, or redesign.',MEDIUM:'Next step: add to cleanup backlog, document owner and purpose, and review in the next governance cycle.',LOW:'Next step: confirm expected design and keep for trend monitoring.'}[f.severity]||'Next step: confirm owner and evidence.';return base+' '+next;}
function briefText(v,max=130){let t=String(v??'').replace(/\s+/g,' ').trim();return t.length>max?t.slice(0,max-1)+'…':t;}
function csvEscape(v){return '"'+String(v??'').replace(/"/g,'""')+'"';}
function downloadFindingsCsv(){let cols=['severity','status','area','object','title','evidence','recommendation'];let rows=sortFindings(allFindings()).map(f=>[f.severity,findingStatus(f),f.area,f.object||'',f.title,briefText(f.detail,180),briefText(enrichRecommendation(f),220)]);let csv='\ufeff'+[cols.map(csvEscape).join(','),...rows.map(r=>r.map(csvEscape).join(','))].join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sf-config-debt-findings.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}
function groupedRoadmapItems(list){let map={};for(const f of list){let key=f.severity+'|'+f.area+'|'+f.title;let g=map[key]||(map[key]={severity:f.severity,area:f.area,title:f.title,count:0,objects:[],recommendation:enrichRecommendation(f)});g.count++;if(f.object&&!g.objects.includes(f.object))g.objects.push(f.object);}return Object.values(map).sort((a,b)=>(SEVERITY_ORDER[a.severity]??9)-(SEVERITY_ORDER[b.severity]??9)||b.count-a.count||a.area.localeCompare(b.area));}
function findingKey(f){return [f.severity,f.area,f.object||'',f.title].join('|');}
function findingStatus(f){return state.findingStatus[findingKey(f)]||'Active';}
function setFindingStatus(k,v){state.findingStatus[k]=v;save();renderFindings();renderRoadmap();renderExport();}
function activeFindings(){return allFindings().filter(f=>!['False positive','Remediated','Not in scope','Accepted risk'].includes(findingStatus(f)));}
function groupFindings(list){let map={};for(const f of list){let key=f.severity+'|'+f.area+'|'+f.title;let g=map[key]||(map[key]={key,severity:f.severity,area:f.area,title:f.title,count:0,items:[]});g.count++;g.items.push(f);}return Object.values(map).sort((a,b)=>(SEVERITY_ORDER[a.severity]??9)-(SEVERITY_ORDER[b.severity]??9)||b.count-a.count||a.area.localeCompare(b.area));}
function toggleGroup(id){let el=document.getElementById(id);if(el)el.classList.toggle('open');}
function reportPayload(){return {generated_at:new Date().toISOString(),summary:state.summary,coverage:areaCoverageRows(),score:score(),findings:allFindings().map(f=>({...f,status:findingStatus(f),recommendation:enrichRecommendation(f)})),roadmap:groupedRoadmapItems(activeFindings())};}
function exportWorksheet(name, rows){let escXml=v=>String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));return `<Worksheet ss:Name="${escXml(name)}"><Table>${rows.map(r=>`<Row>${r.map(c=>`<Cell><Data ss:Type="String">${escXml(c)}</Data></Cell>`).join('')}</Row>`).join('')}</Table></Worksheet>`;}
function downloadExcel(){let payload=reportPayload();let sev=payload.findings.reduce((a,f)=>{a[f.severity]=(a[f.severity]||0)+1;return a;},{});let summary=[['Metric','Value'],['Generated',payload.generated_at],['Score',payload.score.overall],['Risk',payload.score.risk],['Findings',payload.findings.length],['Active findings',activeFindings().length],['Critical',sev.CRITICAL||0],['High',sev.HIGH||0],['Medium',sev.MEDIUM||0],['Low',sev.LOW||0],['Entities',state.summary.entity_count||0],['Enabled custom fields',state.summary.custom_field_count||0],['Ignored delivered slots',state.summary.ignored_custom_field_count||0]];let findings=[['Severity','Status','Area','Object','Title','Evidence','Recommendation'],...payload.findings.map(f=>[f.severity,f.status,f.area,f.object||'',f.title,briefText(f.detail,240),briefText(f.recommendation,320)])];let roadmap=[['Phase input','Severity','Area','Theme','Signals','Objects','Recommendation'],...payload.roadmap.map(r=>['Active findings',r.severity,r.area,r.title,r.count,(r.objects||[]).join('; '),r.recommendation])];let coverage=[['Area','$metadata coverage','Evidence basis','Extract from'],...payload.coverage.map(r=>[r.area,r.metadataStatus,r.basis,r.extract])];let compare=compareRows();let xml=`<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">${exportWorksheet('Summary',summary)}${exportWorksheet('Findings',findings)}${exportWorksheet('Roadmap',roadmap)}${exportWorksheet('Coverage',coverage)}${exportWorksheet('Comparison',compare)}</Workbook>`;let blob=new Blob([xml],{type:'application/vnd.ms-excel'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sf-config-debt-report.xls';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}
function compareRows(){let cur=reportPayload();let prev=state.previousReport;if(!prev)return [['Metric','Previous','Current','Change'],['No previous report imported','','','']];let pf=prev.findings||[];let cf=cur.findings||[];let count=(arr,sev)=>arr.filter(f=>f.severity===sev).length;let rows=[['Metric','Previous','Current','Change'],['Score',prev.score?.overall??'',cur.score.overall,(cur.score.overall-(prev.score?.overall||0))],['Total findings',pf.length,cf.length,cf.length-pf.length],['Critical',count(pf,'CRITICAL'),count(cf,'CRITICAL'),count(cf,'CRITICAL')-count(pf,'CRITICAL')],['High',count(pf,'HIGH'),count(cf,'HIGH'),count(cf,'HIGH')-count(pf,'HIGH')],['Medium',count(pf,'MEDIUM'),count(cf,'MEDIUM'),count(cf,'MEDIUM')-count(pf,'MEDIUM')],['Low',count(pf,'LOW'),count(cf,'LOW'),count(cf,'LOW')-count(pf,'LOW')]];return rows;}
function renderComparison(){let rows=compareRows();if(!state.previousReport)return '<div class="notice warn">Import a previous JSON export to compare score, severity counts, and finding volume.</div>';return `<table><thead><tr>${rows[0].map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td class="${Number(r[3])>0?'compare-up':Number(r[3])<0?'compare-down':'compare-flat'}">${esc(r[3])}</td></tr>`).join('')}</tbody></table>`;}
function importPreviousReport(input){let file=input.files&&input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{state.previousReport=JSON.parse(reader.result);save();renderExport();}catch(e){alert('Could not parse JSON report: '+e.message);}};reader.readAsText(file);}
function rememberCredentialToggle(el){state.rememberCredentials=el.checked;if(el.checked){state.baseUrl=document.getElementById('baseUrl').value;state.username=document.getElementById('username').value;state.password=document.getElementById('password').value;}else{delete state.username;delete state.password;}save();}
function clearStoredCredentials(){delete state.username;delete state.password;state.rememberCredentials=false;save();renderConnect();document.getElementById('connectResult').textContent='Stored browser credentials cleared.';}
function allFindings(){let out=[...state.findings];QUESTIONS.forEach((q,i)=>{let ans=state.answers[i];if(ans===undefined)return;let sev=q.sev[ans];if(sev!=='LOW')out.push({severity:sev,area:q.area,title:'Assessment debt signal',detail:q.q+' Answer: '+q.opts[ans],recommendation:'Review governance and add this area to the cleanup backlog.'});});return sortFindings(out);}
function render(){renderOverview();renderAssessment();renderMetadata();renderConnect();renderFindings();renderRoadmap();renderExport();}
function renderOverview(){let s=score();let coverage=areaCoverageRows();let html=`<div class="grid"><div class="card"><div class="muted">Overall debt score</div><div class="metric">${s.overall}</div><p>Risk level: <strong>${s.risk}</strong></p></div><div class="card"><div class="muted">Findings</div><div class="metric">${allFindings().length}</div><p>Generated from assessment, metadata scan, and evidence gaps.</p></div><div class="card"><div class="muted">EC entities</div><div class="metric">${state.summary.ec_entity_count||0}</div><p>From OData $metadata import or live scan.</p></div><div class="card"><div class="muted">Metadata-covered areas</div><div class="metric">${coverage.filter(x=>x.metadataStatus==='Detected in metadata').length}</div><p>Areas with candidate OData entities detected.</p></div></div><div class="card"><h2>Debt heatmap</h2><p class="muted">Bars show active risk score by area. The evidence tag shows whether $metadata can support the area or whether a separate SuccessFactors export should be added to the repo.</p>${AREAS.map(a=>{let c=coverage.find(x=>x.area===a);return `<div class="heat"><span>${a}<br><small class="${coverageClass(c.metadataStatus)}">${esc(c.metadataStatus)}</small></span><div style="min-width:220px"><div class="bar"><div class="fill" style="width:${s.areaScores[a]}%"></div></div><small>${s.areaScores[a]} / 100 - ${esc(briefText(c.basis,80))}</small></div></div>`}).join('')}</div><div class="card"><h2>Evidence coverage and extraction plan</h2>${coverageTable()}</div><div class="notice warn"><strong>Live tenant note:</strong> $metadata is safe for schema signals, but it cannot prove usage, ownership, overlap, or runtime risk for every area. Where coverage says separate extract, save the client-approved export in the repo data folder and treat it as evidence for the next scan.</div>`;document.getElementById('overview').innerHTML=html;}
function renderAssessment(){document.getElementById('assessment').innerHTML=`<div class="card"><h2>Guided debt assessment</h2><p class="muted">Use this in client workshops when tenant access is not available.</p>${QUESTIONS.map((q,i)=>`<div class="q"><div class="q-title">${i+1}. ${esc(q.q)}</div><label>Answer<select onchange="state.answers[${i}]=Number(this.value);save();render()"><option value="" ${state.answers[i]===undefined?'selected':''}>Select</option>${q.opts.map((o,j)=>`<option value="${j}" ${state.answers[i]===j?'selected':''}>${esc(o)}</option>`).join('')}</select></label><span class="pill">Area: ${q.area}</span></div>`).join('')}<div class="actions"><button onclick="state.answers={};save();render()">Clear answers</button></div></div>`;}
function renderMetadata(){document.getElementById('metadata').innerHTML=`<div class="card"><h2>Metadata import</h2><p class="muted">Paste or upload OData $metadata XML. The app parses schema only, no employee records.</p><label>Paste metadata XML<textarea id="metadataXml" placeholder="<edmx:Edmx ...>"></textarea></label><div class="actions"><button onclick="parseMetadataText()">Parse metadata</button><button class="secondary" onclick="loadDemoMetadata()">Load demo metadata</button></div><div class="grid"><div class="card"><h3>Entities</h3><div class="metric">${state.summary.entity_count||0}</div></div><div class="card"><h3>Enabled custom fields</h3><div class="metric">${state.summary.custom_field_count||0}</div><p class="muted">Ignored inactive SF-delivered slots: ${state.summary.ignored_custom_field_count||0}</p></div><div class="card"><h3>Picklist entities</h3><div class="metric">${state.summary.picklist_entity_count||0}</div></div></div></div><div class="card"><h2>What $metadata can and cannot prove</h2><p class="muted">Detected means the metadata exposes candidate entities or fields. Needs separate extract means the app will show the extraction source and include an evidence-gap finding.</p>${coverageTable()}</div>`;}
function renderConnect(){document.getElementById('connect').innerHTML=`<div class="card"><h2>Live tenant scan</h2><p class="muted">Browser requests to SF are blocked by CORS. Run the local proxy first: <code>python3 proxy.py</code> on port 5002.</p><div class="row"><label>Base URL<input id="baseUrl" value="${esc(state.baseUrl||'https://api55.sapsf.eu/odata/v2')}" oninput="if(state.rememberCredentials){state.baseUrl=this.value;save()}"></label></div><div class="row"><label>Username (format: user@CompanyID)<input id="username" autocomplete="off" placeholder="admin@COMPANYID" value="${esc(state.username||'')}" oninput="if(state.rememberCredentials){state.username=this.value;save()}"></label><label>Password<input id="password" type="password" autocomplete="off" value="${esc(state.password||'')}" oninput="if(state.rememberCredentials){state.password=this.value;save()}"></label></div><label style="display:flex;align-items:center;gap:8px;margin:12px 0"><input type="checkbox" id="useProxy" style="width:auto;margin:0" onchange="state.useProxy=this.checked;save()" ${state.useProxy?'checked':''}> Use local proxy (python3 proxy.py on port 5002)</label><label style="display:flex;align-items:center;gap:8px;margin:12px 0"><input type="checkbox" id="rememberCredentials" style="width:auto;margin:0" onchange="rememberCredentialToggle(this)" ${state.rememberCredentials?'checked':''}> Remember Base URL, username, and password in this browser</label><div class="actions"><button onclick="browserMetadataFetch()">Fetch metadata</button><button class="secondary" onclick="copyPythonConfig()">Copy Python config</button><button class="secondary" onclick="clearStoredCredentials()">Clear saved credentials</button></div><div id="connectResult" class="mono muted"></div><div class="notice warn" style="margin-top:14px"><strong>Setup:</strong> Open a terminal in this directory and run <code>python3 proxy.py</code>. Keep Base URL as the real SF URL. Tick local proxy, enter credentials, and click Fetch metadata.</div></div>`;}
function renderFindings(){let all=sortFindings(allFindings());let active=activeFindings();let counts=active.reduce((a,x)=>{a[x.severity]=(a[x.severity]||0)+1;return a;},{});let groups=groupFindings(all);let html=groups.map((g,i)=>{let id='fg'+i;let activeCount=g.items.filter(x=>findingStatus(x)==='Active').length;let rows=g.items.map(x=>{let k=findingKey(x);let st=findingStatus(x);return `<tr><td>${esc(x.object||'')}</td><td title="${esc(x.detail)}">${esc(briefText(x.detail,100))}</td><td title="${esc(enrichRecommendation(x))}">${esc(briefText(enrichRecommendation(x),120))}</td><td><select class="status-select" onchange="setFindingStatus('${esc(k)}',this.value)">${['Active','Accepted risk','False positive','Remediated','Not in scope'].map(v=>`<option ${st===v?'selected':''}>${v}</option>`).join('')}</select></td></tr>`;}).join('');return `<div class="group-card ${i<3?'open':''}" id="${id}"><div class="group-head" onclick="toggleGroup('${id}')"><div><strong class="sev-${g.severity}">${g.severity}</strong> - ${esc(g.area)}: ${esc(g.title)}<div class="muted mini">${g.count} signal(s), ${activeCount} active</div></div><span class="pill">Expand</span></div><div class="group-body"><table><thead><tr><th>Object</th><th>Evidence</th><th>Recommendation</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;}).join('');document.getElementById('findings').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap"><div><h2>Findings</h2><p class="muted">Grouped by theme. Active findings drive score, roadmap, and summary. Critical: ${counts.CRITICAL||0}, High: ${counts.HIGH||0}, Medium: ${counts.MEDIUM||0}, Low: ${counts.LOW||0}.</p></div><div class="actions"><button onclick="downloadFindingsCsv()">Download CSV</button><button onclick="downloadExcel()">Download Excel</button><button class="secondary" onclick="window.print()">Print</button></div></div>${html||'<p>No findings.</p>'}</div>`;}
function renderRoadmap(){let items=groupedRoadmapItems(activeFindings());let urgent=items.filter(x=>['CRITICAL','HIGH'].includes(x.severity));let med=items.filter(x=>x.severity==='MEDIUM');let phases=[{p:'Phase 1',t:'Stabilise immediate risk',time:'1-2 weeks',desc:'Handle Critical and High themes first. Confirm owners, affected objects, business impact, and quick decisions.',a:urgent.slice(0,5)},{p:'Phase 2',t:'Reduce configuration debt',time:'3-6 weeks',desc:'Work through remaining High and Medium themes. Rationalise duplicate/custom objects and document what stays.',a:urgent.slice(5).concat(med.slice(0,5))},{p:'Phase 3',t:'Governance and trend',time:'7-12 weeks',desc:'Turn cleanup into a repeatable control so debt does not rebuild after releases or transformation waves.',a:[{severity:'LOW',area:'Governance',title:'Quarterly EC configuration debt review',count:1,objects:[],recommendation:'Introduce a quarterly review with named owners, evidence, decisions, and due dates.'},{severity:'LOW',area:'Standards',title:'Naming and ownership standards',count:1,objects:[],recommendation:'Create standards for rules, fields, event reasons, MDF objects, and reports before new build starts.'},{severity:'LOW',area:'Trend',title:'Before and after debt score tracking',count:1,objects:[],recommendation:'Track debt score before and after each release or transformation wave and review movement by area.'}]}];document.getElementById('roadmap').innerHTML=`<div class="card"><h2>90-day cleanup roadmap</h2><p class="muted">Grouped by theme to avoid repeated bullets. Counts show how many objects or signals are behind each theme.</p>${phases.map(x=>`<div class="phase"><h3>${x.p}: ${x.t}</h3><p class="muted"><strong>${x.time}</strong> - ${esc(x.desc)}</p><ul>${(x.a.length?x.a:[{severity:'LOW',area:'Planning',title:'Confirm scope and owner',count:1,objects:[],recommendation:'Confirm scope, owner, decision path, and next review date.'}]).map(a=>`<li><strong class="sev-${a.severity}">${a.severity}</strong> - ${esc(a.area)}: ${esc(a.title)} ${a.count>1?`<span class="pill">${a.count} signals</span>`:''}<br><span class="muted">${a.objects.length?`Objects: ${esc(a.objects.slice(0,6).join(', '))}. `:''}${esc(a.recommendation)}</span></li>`).join('')}</ul></div>`).join('')}</div>`;}
function renderExport(){let report=reportPayload();document.getElementById('export').innerHTML=`<div class="card"><h2>Export and compare</h2><div class="actions"><button onclick="downloadJson()">Download JSON</button><button onclick="downloadExcel()">Download Excel</button><button onclick="window.print()">Print report</button><label class="btn">Import previous JSON<input type="file" accept="application/json,.json" onchange="importPreviousReport(this)" style="display:none"></label><button class="danger" onclick="localStorage.removeItem('sfDebtRadar');location.reload()">Reset app</button></div><h3>Previous report comparison</h3>${renderComparison()}<h3>Current JSON</h3><pre class="mono">${esc(JSON.stringify(report,null,2))}</pre></div>`;}
function propAttr(p,names){for(const n of names){let v=p.getAttribute(n)||p.getAttribute('sap:'+n)||p.getAttributeNS('*',n);if(v!==null&&v!==undefined)return String(v);}return '';}
function isStandardCustomSlot(fieldName){return /^custom(String|Long|Double|Date|Bool|Boolean|Integer|Decimal|Double)\d+$/i.test(fieldName);}
function isEnabledCustomField(p){let n=p.getAttribute('Name')||'';if(n.startsWith('cust_'))return true;if(!n.toLowerCase().includes('custom'))return false;if(!isStandardCustomSlot(n))return true;let visible=propAttr(p,['visible']);if(visible.toLowerCase()==='false')return false;let label=propAttr(p,['label','quickinfo']).trim();if(!label)return false;let generic=new RegExp('^'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'$','i');if(generic.test(label.replace(/[\s_-]/g,'')))return false;if(/^custom\s*(string|long|date|double|bool|boolean|integer|decimal)?\s*\d+$/i.test(label))return false;return true;}
function parseMetadataText(){let xml=document.getElementById('metadataXml').value;if(!xml.trim()){alert('Paste metadata XML first');return;}parseMetadata(xml);save();render();switchView('overview');}
function loadDemoMetadata(){parseMetadata(DEMO_XML);save();render();switchView('overview');}
function parseMetadata(xml){let doc=new DOMParser().parseFromString(xml,'application/xml');let types=[...doc.getElementsByTagNameNS('*','EntityType')];let entities={};let findings=[];let ignoredCustom=0;for(const e of types){let name=e.getAttribute('Name');if(!name)continue;let props=[...e.getElementsByTagNameNS('*','Property')];let navs=[...e.getElementsByTagNameNS('*','NavigationProperty')];let propNames=props.map(p=>p.getAttribute('Name')||'');let customProps=props.filter(p=>(p.getAttribute('Name')||'').toLowerCase().includes('custom')||(p.getAttribute('Name')||'').startsWith('cust_'));let validCustomProps=customProps.filter(isEnabledCustomField);ignoredCustom+=customProps.length-validCustomProps.length;let custom=validCustomProps.length;let hasStart=props.some(p=>['effectiveStartDate','startDate','cust_effectiveStartDate'].includes(p.getAttribute('Name')));let hasStatus=props.some(p=>['status','effectiveStatus','active'].includes(p.getAttribute('Name')));entities[name]={field_count:props.length,custom_field_count:custom,ignored_custom_field_count:customProps.length-custom,nav_count:navs.length,has_effective_start_date:hasStart,has_status_field:hasStatus};if((name.startsWith('Emp')||name==='Position'||name.startsWith('cust_'))&&props.length>=100)findings.push({source:'metadata',severity:'MEDIUM',area:'Metadata',object:name,title:'High field count',detail:`${name} has ${props.length} fields.`,recommendation:'Review field ownership and testing impact.'});if(custom>=20)findings.push({source:'metadata',severity:'HIGH',area:'Custom Fields',object:name,title:'Custom field concentration',detail:`${name} has ${custom} enabled custom-looking fields. Ignored ${customProps.length-custom} inactive or generic SF-delivered custom slots.`,recommendation:'Confirm owner, purpose, usage, and integration dependency for enabled custom fields only.'});if(name.startsWith('cust_')&&!hasStart)findings.push({source:'metadata',severity:'MEDIUM',area:'MDF Objects',object:name,title:'Custom MDF object without effective dating',detail:`${name} has no effective start date in metadata.`,recommendation:'Confirm if history is required or document limitation.'});if((name.startsWith('FO')||/Department|Division|Location|Cost/i.test(name))&&!hasStatus)findings.push({source:'metadata',severity:'LOW',area:'Foundation Objects',object:name,title:'Foundation object without obvious status field',detail:`${name} metadata did not show status/effectiveStatus/active.`,recommendation:'Confirm active and inactive governance.'});if(/Rule|BusinessRule/i.test(name))findings.push({source:'metadata-availability',severity:'LOW',area:'Business Rules',object:name,title:'Business rule entity available in OData metadata',detail:`${name} is exposed in $metadata. Use a record-level extract to assess rule volume, triggers, target fields, and ownership.`,recommendation:'Extract rule definitions and assignments into repo data/business-rules.csv before scoring detailed business rule debt.'});if(/PermissionRole|PermissionGroup|RoleBasedPermission/i.test(name))findings.push({source:'metadata-availability',severity:'LOW',area:'RBP',object:name,title:'RBP entity available in OData metadata',detail:`${name} is exposed in $metadata. Use a permission matrix extract to assess role overlap, target population, and toxic combinations.`,recommendation:'Extract permission role and group matrix into repo data/rbp-matrix.csv before scoring detailed RBP debt.'});if(/WfRequest|Workflow|WfStep/i.test(name))findings.push({source:'metadata-availability',severity:'LOW',area:'Workflows',object:name,title:'Workflow entity available in OData metadata',detail:`${name} is exposed in $metadata. Use workflow config and request extracts to assess aging, escalation, and fallback coverage.`,recommendation:'Extract workflow configuration and open request aging into repo data/workflows.csv.'});if(name==='EmpJob'&&propNames.includes('eventReason'))findings.push({source:'metadata-availability',severity:'LOW',area:'Event Reasons',object:'EmpJob.eventReason',title:'Event reason field visible in EmpJob metadata',detail:'EmpJob exposes eventReason in $metadata. Usage and obsolete values require counts by event reason.',recommendation:'Extract Event Reason setup and EmpJob counts by eventReason into repo data/event-reasons.csv.'});}
let names=Object.keys(entities);state.entityNames=names;state.summary={entity_count:names.length,ec_entity_count:names.filter(n=>n.startsWith('Emp')||n.startsWith('Per')||n==='Position').length,custom_mdf_count:names.filter(n=>n.startsWith('cust_')).length,foundation_count:names.filter(n=>n.startsWith('FO')).length,picklist_entity_count:names.filter(n=>n.toLowerCase().includes('picklist')).length,custom_field_count:names.reduce((s,n)=>s+entities[n].custom_field_count,0),ignored_custom_field_count:ignoredCustom,metadata_scanned_at:new Date().toISOString()};state.findings=sortFindings(findings.concat(evidenceGapFindings(names)));}

async function browserMetadataFetch(){let out=document.getElementById('connectResult');out.textContent='Fetching metadata...';let base=document.getElementById('baseUrl').value.replace(/\/$/,'');let u=document.getElementById('username').value;let p=document.getElementById('password').value;if(!u||!p){out.textContent='Enter username and password first.';return;}let useProxy=document.getElementById('useProxy').checked;state.useProxy=useProxy;state.baseUrl=base;if(state.rememberCredentials){state.username=u;state.password=p;}else{delete state.username;delete state.password;}save();let headers={'Accept':'application/xml','Authorization':'Basic '+btoa(u+':'+p)};try{let target=useProxy?('http://localhost:5002/'+base+'/$metadata'):(base+'/$metadata');let res=await fetch(target,{headers});if(!res.ok)throw new Error('HTTP '+res.status+' - check credentials and Base URL.');let xml=await res.text();parseMetadata(xml);save();render();document.getElementById('connectResult').textContent='Metadata fetched. Findings: '+state.findings.length+'. Switch to Overview tab to see results.';}catch(e){let msg=e.message;if(!useProxy&&(msg.includes('Failed to fetch')||msg.includes('NetworkError')))msg='CORS blocked - check "Use local proxy" and run python3 proxy.py first.';if(useProxy&&msg.includes('Failed to fetch'))msg='Proxy not running - run python3 proxy.py in the project directory.';out.textContent='Fetch failed: '+msg;}}
function copyPythonConfig(){let base=document.getElementById('baseUrl').value;let txt=`sf:\n  auth_method: basic\n  base_url: "${base}"\n  username: "admin@COMPANYID"\n  password: ""\nscan:\n  tier1_enabled: true\n`;navigator.clipboard?.writeText(txt);document.getElementById('connectResult').textContent=txt;}
function downloadJson(){let report=reportPayload();let blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sf-config-debt-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}
function demoFindings(){return[{source:'demo-base',severity:'MEDIUM',area:'Event Reasons',title:'Event reason review cycle missing',detail:'No event reason usage evidence has been loaded yet.',recommendation:'Load OData counts or export event reason usage before cleanup.'},{source:'demo-base',severity:'MEDIUM',area:'RBP',title:'RBP overlap not assessed',detail:'Permission role matrix has not been imported.',recommendation:'Import RBP role matrix in the next version or run dedicated RBP scanner.'}]}
const DEMO_XML=`<edmx:Edmx xmlns:edmx="http://schemas.microsoft.com/ado/2007/06/edmx"><edmx:DataServices><Schema xmlns="http://schemas.microsoft.com/ado/2008/09/edm"><EntityType Name="EmpJob"><Property Name="userId" Type="Edm.String" Nullable="false"/><Property Name="eventReason" Type="Edm.String" Nullable="true"/><Property Name="customString12" Type="Edm.String" Nullable="true"/><Property Name="customString13" Type="Edm.String" Nullable="true"/><Property Name="startDate" Type="Edm.DateTime" Nullable="false"/></EntityType><EntityType Name="Position"><Property Name="code" Type="Edm.String" Nullable="false"/><Property Name="effectiveStartDate" Type="Edm.DateTime" Nullable="false"/><Property Name="effectiveStatus" Type="Edm.String" Nullable="true"/><NavigationProperty Name="departmentNav" ToRole="Department"/></EntityType><EntityType Name="FODepartment"><Property Name="externalCode" Type="Edm.String" Nullable="false"/><Property Name="name" Type="Edm.String" Nullable="true"/></EntityType><EntityType Name="cust_ProjectThing"><Property Name="externalCode" Type="Edm.String" Nullable="false"/><Property Name="cust_owner" Type="Edm.String" Nullable="true"/></EntityType></Schema></edmx:DataServices></edmx:Edmx>`;
initTabs();render();
</script>
